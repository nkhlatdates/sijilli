<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>سجلي التدريبي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: one narrow column; summary strip first, then one row per course with a ruler-style absence gauge that shares a single 0–25% scale. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#12302c; --muted:#5d726e; --line:#d5dfdc;
  --accent:#0f6b60; --accent-soft:#dcebe8;
  --ok:#2c7a4b; --warn:#a8660a; --bad:#b3261e; --bad-soft:#fbe6e3; --warn-soft:#fbefd9; --ok-soft:#e1f1e6;
  --track:#e6ecea;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1716; --surface:#16211f; --ink:#e4eeec; --muted:#93a8a4; --line:#2a3a37;
  --accent:#5cc4b5; --accent-soft:#1c3531;
  --ok:#6fcb8f; --warn:#e6ad4f; --bad:#f28b82; --bad-soft:#3a1c1a; --warn-soft:#37290f; --ok-soft:#173022;
  --track:#24322f; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{color:var(--muted);font-size:13px}
h1{font-family:var(--display);font-size:clamp(26px,6vw,36px);line-height:1.4;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:18px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:14px 12px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.alert b{color:var(--bad)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.bar-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,.course>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.course{border-top:1px solid var(--line)}
.course:first-child{border-top:0}
.course>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:6px 12px;width:100%;padding:16px;cursor:pointer}
.name{font-weight:600;min-width:0}
.code{color:var(--muted);font-size:13px;font-weight:400;margin-inline-start:6px;white-space:nowrap}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;white-space:nowrap;align-self:start}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.gauge{grid-column:1/-1;display:grid;grid-template-columns:1fr 64px;align-items:center;gap:12px}
.track{position:relative;height:10px;background:var(--track);border-radius:5px;direction:ltr}
.fill{position:absolute;inset-block:0;right:0;border-radius:5px}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.limit{position:absolute;inset-block:-4px;right:80%;width:2px;background:var(--ink);opacity:.55}
.pct{font-variant-numeric:tabular-nums;font-weight:600;text-align:start}
.detail{padding:0 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.detail div{min-width:0}
.detail dt{color:var(--muted);font-size:13px}
.detail dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
@media (max-width:520px){.detail{grid-template-columns:repeat(2,1fr)}}
.legend{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:2px;height:14px;background:var(--ink);opacity:.55}
.note{color:var(--muted);font-size:14px;border-inline-start:3px solid var(--accent-soft);padding-inline-start:12px}
.empty{padding:16px;color:var(--muted)}
footer{color:var(--muted);font-size:13px}
body{margin:0}[hidden]{display:none!important}
.grades{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.grades th,.grades td{padding:10px 12px;text-align:start;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.grades th{color:var(--muted);font-size:13px;font-weight:500;border-top:0}
</style>
</head>
<body>
<div class="wrap" id="msg"><h1 id="msgt">جارٍ التحميل…</h1><p class="note" id="msgp" hidden></p></div>
<div class="wrap" id="app" hidden>
  <header>
    <span class="eyebrow" id="term"></span>
    <h1 id="hello"></h1>
    <span class="eyebrow" id="upd"></span>
  </header>
  <section class="stats" id="stats" aria-label="ملخص"></section>
  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="bar-head">
      <h2>المقررات المسجلة</h2>
      <div class="chips" role="group" aria-label="تصفية المقررات">
        <button class="chip" id="f-all" aria-pressed="true">الكل</button>
        <button class="chip" id="f-attn" aria-pressed="false">تحتاج انتباه</button>
      </div>
    </div>
    <div class="legend"><i></i><span>الخط يمثل حد الحرمان 20%. النسبة المعروضة هي الأعلى بين النظري والعملي. اضغط على المقرر لعرض التفاصيل.</span></div>
    <div class="list" id="list"></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:8px">
    <h2>الدرجات</h2>
    <div id="grades"></div>
  </section>
  <footer>هذه الصفحة خاصة بك، فلا تشارك رابطها. المصدر: نظام رايات. عند وجود اختلاف يُعتمد ما في رايات.</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
function fail(){$("msgt").textContent="الرابط غير صحيح";$("msgp").textContent="تأكد من فتح الرابط كاملًا كما وصلك، أو اطلب من مدربك إرساله من جديد.";$("msgp").hidden=false}
async function load(){
  const m=/^#([0-9a-f]{24})\.([A-Za-z0-9_-]{43})$/.exec(location.hash);
  if(!m)return fail();
  try{
    const r=await fetch("d/"+m[1]+".txt",{cache:"no-store"}); if(!r.ok)return fail();
    const raw=b64((await r.text()).trim());
    const key=await crypto.subtle.importKey("raw",b64(m[2]),"AES-GCM",false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12));
    show(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){fail()}
}
const SCALE=25, fmt=x=>(+(+x).toFixed(2)).toString();
const peak=c=>Math.max(c.t,c.p,c.tot);
const state=c=>c.denied?"bad":peak(c)>=10?"warn":"ok";
const label={ok:"منتظم",warn:"اقتربت من الحد",bad:"حرمان بسبب الغياب"};
let D,filter="all";const open=new Set();
function show(d){
  D=d; document.title="سجل "+d.first;
  $("term").textContent=d.term+" · "+d.program; $("hello").textContent="مرحبًا "+d.first+"، هذا سجل حضورك"; $("upd").textContent="آخر تحديث: "+d.updated;
  const C=d.courses,hrs=C.reduce((a,c)=>a+c.h,0),den=C.filter(c=>c.denied).length,warn=C.filter(c=>state(c)==="warn").length;
  $("stats").innerHTML=`<div class="stat"><b>${C.length}</b><span>مقررات مسجلة</span></div><div class="stat"><b>${fmt(hrs)}</b><span>ساعة غياب إجمالًا</span></div><div class="stat"><b>${warn}</b><span>مقرر قريب من الحد</span></div><div class="stat ${den?"alert":""}"><b>${den}</b><span>مقرر محروم</span></div>`;
  const G=d.grades||[];
  $("grades").innerHTML=G.length?`<table class="grades"><tr><th>المقرر</th><th>الدرجة</th><th>التقدير</th></tr>${G.map(g=>`<tr><td>${esc(g.n)}</td><td>${esc(g.s)}</td><td>${esc(g.g||"")}</td></tr>`).join("")}</table>`:`<p class="note" style="margin:0">لم تُضف الدرجات إلى هذه الصفحة بعد. ستظهر هنا عند توفرها.</p>`;
  render(); $("msg").hidden=true; $("app").hidden=false;
}
function render(){
  const rows=D.courses.filter(c=>filter==="all"||state(c)!=="ok");
  $("list").innerHTML=rows.length?rows.map(c=>{const s=state(c),pk=peak(c),i=D.courses.indexOf(c),o=open.has(i);
    return `<div class="course"><button aria-expanded="${o}" data-i="${i}"><span class="name">${esc(c.n)}<span class="code">${esc(c.c)}</span></span><span class="pill ${s}">${label[s]}</span><span class="gauge"><span class="track"><span class="fill ${s}" style="width:${Math.min(pk,SCALE)/SCALE*100}%"></span><span class="limit"></span></span><span class="pct">${fmt(pk)}%</span></span></button>
    <dl class="detail" ${o?"":"hidden"}><div><dt>نسبة الحضور</dt><dd>${fmt(100-c.tot)}%</dd></div><div><dt>نسبة الغياب الإجمالية</dt><dd>${fmt(c.tot)}%</dd></div><div><dt>ساعات الغياب</dt><dd>${fmt(c.h)}</dd></div><div><dt>غياب النظري</dt><dd>${fmt(c.t)}% · ${fmt(c.ht)} ساعة</dd></div><div><dt>غياب العملي</dt><dd>${fmt(c.p)}% · ${fmt(c.hp)} ساعة</dd></div><div><dt>غياب بعذر</dt><dd>${fmt(c.he)} ساعة</dd></div></dl></div>`}).join(""):`<div class="empty">لا توجد مقررات تحتاج انتباه.</div>`;
  $("f-all").setAttribute("aria-pressed",filter==="all"); $("f-attn").setAttribute("aria-pressed",filter==="attn");
}
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=+b.dataset.i;open.has(i)?open.delete(i):open.add(i);render()});
$("f-all").addEventListener("click",()=>{filter="all";render()}); $("f-attn").addEventListener("click",()=>{filter="attn";render()});
addEventListener("hashchange",()=>location.reload()); load();
</script>
</body>
</html>
